name: MCP Test Workflow

on:
  push:
    branches:
      - main
      - milestone12-ai-chat
  pull_request:
    branches:
      - main
      - milestone12-ai-chat

jobs:
  mcp-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pytest-json-report

      - name: Prepare report directories
        run: |
          mkdir -p reports/unit reports/blackbox reports/e2e reports/coverage

      - name: Unit tests
        run: |
          pytest tests/unit/test_mcp_*.py -v \
            --junitxml=reports/unit/junit.xml \
            --json-report --json-report-file=reports/unit/report.json

      - name: Blackbox tests
        run: |
          pytest tests/blackbox/test_mcp_client_simulation.py -v \
            --junitxml=reports/blackbox/junit.xml \
            --json-report --json-report-file=reports/blackbox/report.json

      - name: E2E tests
        run: |
          pytest tests/e2e/test_mcp_e2e_*.py -v \
            --junitxml=reports/e2e/junit.xml \
            --json-report --json-report-file=reports/e2e/report.json

      - name: Coverage report
        run: |
          pytest --cov=src.mcp --cov-report=xml --cov-report=term-missing \
            --junitxml=reports/coverage/junit.xml \
            --json-report --json-report-file=reports/coverage/report.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Coverage check (>=95%)
        run: |
          python -m coverage report --fail-under=95

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports
            coverage.xml
