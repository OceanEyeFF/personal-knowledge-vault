<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Project Planning</title>
</head>
<body>
  <div class="message" data-message-author-role="user" data-turn="user">
    <div class="markdown">
      <p>Hi ChatGPT, can you draft a plan?</p>
    </div>
  </div>
  <div class="message" data-message-author-role="assistant" data-turn="assistant">
    <div class="markdown">
      <p>Sure. Here is a short plan:</p>
      <p>1. Define scope.</p>
      <p>2. Write tests.</p>
    </div>
  </div>
  <div class="message" data-message-author-role="user" data-turn="user">
    <div class="markdown">
      <p>Thanks, that's helpful.</p>
    </div>
  </div>
</body>
</html>
