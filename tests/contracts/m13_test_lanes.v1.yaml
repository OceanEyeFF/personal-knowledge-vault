# Machine-checkable projection of W3-T0 test governance.  Source and packaging
# contracts remain offline and deterministic.  Artifact execution is explicit,
# fail-closed, and delegated to the external PowerShell runner named below.
schema_version: pkv.m13.test-lanes.v1
truth_source: docs/overview/阶段开发路线与依赖-2026-03.md#85-w3短期-test-治理与可复现打包链
default_lane: source

lanes:
  source:
    owner: w1_w2_source_contracts
    selection: default
    pytest_selector: not manual and not network and not artifact and not windows_release_env
    includes_markers: [packaging_contract]
    artifact_required: false
    missing_artifact: not_applicable
    source_tree_import: allowed
    allowed_inputs: [versioned_source, synthetic_fixtures, offline_fault_injection]
    allowed_outputs: [source_verified, w4_handoff_declaration]
    forbidden_substitutes: [packaging_contract_proof, artifact_evidence, artifact_verified]

  packaging-contract:
    owner: w3_packaging_contract
    selection: explicit_or_source_default
    pytest_selector: packaging_contract and not manual and not network and not artifact and not windows_release_env
    pytest_marker: packaging_contract
    included_in_source_default: true
    artifact_required: false
    missing_artifact: not_applicable
    source_tree_import: allowed
    artifact_state_output: forbidden
    allowed_inputs: [clean_checkout, locked_toolchain, versioned_packaging_config, synthetic_harness_contract]
    allowed_outputs: [build_contract_result, payload_manifest, provenance_manifest, harness_contract_result]
    forbidden_outputs: [source_verified, artifact_verified]
    forbidden_substitutes: [w2_domain_semantics, installed_artifact_evidence]

  windows-release-env:
    owner: w3_release_environment_gate
    selection: explicit_only
    pytest_selector: packaging_contract and windows_release_env and not manual and not network and not artifact
    pytest_marker: windows_release_env
    included_in_source_default: false
    required_platform: windows-x86_64
    locked_toolchain_required: true
    artifact_required: false
    missing_toolchain: fail
    source_tree_import: allowed
    artifact_state_output: forbidden
    allowed_inputs: [clean_checkout, exact_release_environment_lock, versioned_packaging_config]
    allowed_outputs: [release_environment_verified, installer_contract_result]
    forbidden_outputs: [source_verified, artifact_verified]
    forbidden_substitutes: [source_lane_result, installed_artifact_evidence]

  artifact-only:
    owner: w4_artifact_e2e
    selection: explicit_only
    pytest_selector: artifact and not manual and not network
    pytest_marker: artifact
    artifact_required: true
    missing_artifact: fail
    source_tree_import: forbidden
    repository_cwd: forbidden
    runner: scripts/run-artifact-e2e.ps1
    required_inputs:
      - installed_artifact_root
      - installed_entrypoint
      - artifact_manifest
      - synthetic_fixture
      - evidence_root
    conditional_inputs:
      - external_harness_when_scenario_requires
    allowed_inputs: [installed_artifact, artifact_manifest, synthetic_fixture, external_harness_when_required]
    allowed_outputs: [artifact_evidence, artifact_verified, artifact_failed]
    forbidden_outputs: [source_verified, packaging_contract_proof]
    forbidden_substitutes: [source_tree_smoke, direct_module_call, handoff_declaration, packaging_contract_result]
    forbidden_outcomes: [skip, xfail, xpass, source_fallback]
