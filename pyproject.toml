[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pkv-kernel"
version = "0.8.1"
description = "Headless Personal Knowledge Vault Kernel SDK"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Personal Knowledge Vault contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML==6.0.1",
    "beautifulsoup4==4.12.3",
    "hnswlib==0.8.0",
    "html2text==2020.1.16",
    "httpx>=0.27,<1",
    "jieba==0.42.1",
    "lxml==5.3.0",
    "numpy>=1.24",
    "openai>=1.55.3,<2",
    "python-frontmatter==1.1.0",
    "rich==13.7.0",
    "urllib3>=2.2,<3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
    "pkv_kernel*",
    "src",
    "src.ai*",
    "src.application*",
    "src.kernel*",
    "src.processors*",
    "src.relations*",
    "src.retrieval*",
    "src.runtime*",
    "src.storage*",
    "src.utils*",
    "src.workflow*",
]
exclude = [
    "src.cli*",
    "src.gui*",
    "src.mcp*",
    "tests*",
]
