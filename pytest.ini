[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = manual_test* *.egg .* _darcs build CVS dist node_modules venv {arch}
addopts = --strict-markers -ra -m "not manual and not network and not artifact"
markers =
    network: performs or enables outbound network or paid API calls; opt-in only
    manual: requires an operator, GUI interaction, credentials, or subjective validation
    packaging_contract: validates build inputs, payload policy, manifests, or external harness contracts; included in the default offline lane
    artifact: exercises an explicitly supplied installed Artifact; opt-in only
    slow: runtime classification only; does not grant network access
