# Personal Knowledge Vault - 主配置文件
# 版本: 1.0
# 创建日期: 2026-02-14

# ===========================
# 数据存储配置
# ===========================
# 产品只解析一个数据根。默认是 %USERPROFILE%/.pkv/data；可在用户配置
# %USERPROFILE%/.pkv/config.yaml 中设置 storage.data_root，或由
# PKV_DATA_ROOT 临时覆盖。db/vault/vectors/logs/tmp 均由该根派生，
# 不再接受分别配置的业务路径。
storage: {}

# ===========================
# AI 服务配置
# 说明：这里是项目默认值；用户私有值（可含 Key）只放入
# %USERPROFILE%/.pkv/config.yaml，绝不放入 data-root/config/local.yaml。
# ===========================
ai:
  # OpenAI-compatible LLM 配置（摘要、标签、对话分析）
  # API Key 请写入 %USERPROFILE%/.pkv/config.yaml，不要提交到版本库。
  llm:
    provider: "openai_compatible"
    api_key: ""
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    max_tokens: 2000
    temperature: 0.7
    timeout_seconds: 30
    max_retries: 2

  # OpenAI-compatible Embedding 配置
  # API Key 请写入 %USERPROFILE%/.pkv/config.yaml，不要提交到版本库。
  # 注意：Embedding 端点/模型/维度是向量索引契约，不是普通偏好项。
  # 更换端点、模型或维度后，必须重建向量索引并重新生成文档/分块 Embedding。
  embedding:
    provider: "openai_compatible"
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "text-embedding-3-small"
    dim: 1536
    timeout_seconds: 30
    max_retries: 3

  # R4 内部自动 AI 生命周期默认关闭。用户只在决定启用时，才在
  # %USERPROFILE%/.pkv/config.yaml 确认当前 policy_sha256；缺少 token
  # 配额或确认不会构造 Provider。pricing 为可选，缺少时仅记录 token。
  automation:
    schema_version: 1
    enabled: false
    authorization:
      policy_sha256: null
    token_budget:
      timezone: "UTC"
      daily_total_tokens: null
      monthly_total_tokens: null
    retry:
      max_attempts: 2

  # Whisper 配置 (Phase 2)
  whisper:
    model: "whisper-1"

# ===========================
# 检索配置
# ===========================
retrieval:
  # BM25 参数
  bm25:
    k1: 1.5           # 词频饱和参数
    b: 0.75           # 文档长度归一化参数

  # 向量检索参数
  vector:
    top_k: 10         # 返回 Top K 结果
    ef_search: 50     # HNSW 搜索深度

  # 混合检索权重
  hybrid:
    bm25_weight: 0.4
    vector_weight: 0.6

  # 检索策略阈值
  strategy_thresholds:
    keyword_max_length: 2000    # 短文本用 BM25
    vector_min_length: 5000     # 长文本用向量分块
    # 中间长度用混合检索

# ===========================
# 内容处理配置
# ===========================
processors:
  # 微信公众号
  wechat:
    timeout: 30
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

  # 知乎
  zhihu:
    timeout: 30
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    # 登录 Cookie 属于本机敏感配置，仅在 %USERPROFILE%/.pkv/config.yaml 中填写。
    cookie: ""

  # 通用网页
  generic:
    timeout: 30
    readability_min_length: 500  # 最小正文长度

# ===========================
# jieba 中文分词配置
# ===========================
jieba:
  # 自定义词典路径
  custom_dict: "config/custom_dict.txt"

  # 停用词列表 (可选)
  stop_words:
    - "的"
    - "了"
    - "在"
    - "是"
    - "我"
    - "有"
    - "和"

# ===========================
# 日志配置
# ===========================
logging:
  level: "INFO"       # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

  # 文件日志
  file:
    enabled: true
    # 路径由唯一数据根派生为 <data-root>/logs/pkv.log。
    max_bytes: 10485760    # 10 MB
    backup_count: 5

  # 控制台日志
  console:
    enabled: true
    colorize: true
