# Personal Knowledge Vault - 主配置文件
# 版本: 1.0
# 创建日期: 2026-02-14

# ===========================
# 数据存储配置
# ===========================
storage:
  # Markdown Vault 目录
  vault_dir: ".data/vault"

  # SQLite 数据库路径
  db_path: ".data/db/knowledge_vault.db"

  # 向量索引目录
  vector_index_dir: ".data/vectors"

  # 日志目录
  log_dir: ".data/logs"

  # 临时文件目录
  tmp_dir: ".data/tmp"

# ===========================
# AI 服务配置
# 说明：这里是项目默认值；PKV_LLM_* / PKV_EMBD_* 环境变量会在运行时覆盖对应 API/模型配置。
# ===========================
ai:
  # OpenAI-compatible LLM 配置（摘要、标签、对话分析）
  # API Key 请使用环境变量 PKV_LLM_API_KEY，不写入本文件。
  llm:
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
    max_tokens: 2000
    temperature: 0.7

  # OpenAI-compatible Embedding 配置
  # API Key 请使用环境变量 PKV_EMBD_API_KEY，不写入本文件。
  # 注意：Embedding 模型/维度是向量索引契约，不是普通偏好项。
  # 更换模型或维度后，必须重建向量索引并重新生成文档/分块 Embedding。
  embedding:
    base_url: "https://api.openai.com/v1"
    model: "text-embedding-3-small"
    dim: 1536

  # Whisper 配置 (Phase 2)
  whisper:
    model: "whisper-1"

# ===========================
# 检索配置
# ===========================
retrieval:
  # BM25 参数
  bm25:
    k1: 1.5           # 词频饱和参数
    b: 0.75           # 文档长度归一化参数

  # 向量检索参数
  vector:
    top_k: 10         # 返回 Top K 结果
    ef_search: 50     # HNSW 搜索深度

  # 混合检索权重
  hybrid:
    bm25_weight: 0.4
    vector_weight: 0.6

  # 检索策略阈值
  strategy_thresholds:
    keyword_max_length: 2000    # 短文本用 BM25
    vector_min_length: 5000     # 长文本用向量分块
    # 中间长度用混合检索

# ===========================
# 内容处理配置
# ===========================
processors:
  # 微信公众号
  wechat:
    timeout: 30
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

  # 知乎
  zhihu:
    timeout: 30
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

  # 通用网页
  generic:
    timeout: 30
    readability_min_length: 500  # 最小正文长度

# ===========================
# 工作流配置
# ===========================
workflows:
  # 归档 URL 工作流
  archive_url:
    steps:
      - fetch
      - analyze
      - sharpen    # idea Sharpen (根据内容决定是否触发)
      - store

  # 搜索工作流
  search:
    default_strategy: "hybrid"
    max_results: 10

# ===========================
# jieba 中文分词配置
# ===========================
jieba:
  # 自定义词典路径
  custom_dict: "config/custom_dict.txt"

  # 停用词列表 (可选)
  stop_words:
    - "的"
    - "了"
    - "在"
    - "是"
    - "我"
    - "有"
    - "和"

# ===========================
# 日志配置
# ===========================
logging:
  level: "INFO"       # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

  # 文件日志
  file:
    enabled: true
    path: ".data/logs/pkv.log"
    max_bytes: 10485760    # 10 MB
    backup_count: 5

  # 控制台日志
  console:
    enabled: true
    colorize: true
