# Archive Text Workflow Configuration
# 归档文本工作流配置
#
# 用途: 遗留 WorkflowEngine 的纯文本兼容配置；不是公开 R4 archive 的执行配置
# 触发方式: CLI 或 MCP Tool `archive_text(text, title)`
#
# 此 YAML 仅描述 WorkflowEngine 兼容步骤；该 Engine 路径可保留历史的 Analyze/Store 行为。
# 真实 CLI/MCP `archive_text` 不执行该 step list：它由 KnowledgeApplication 直接进入
# Q0 admission/PreparedDocument → Q1′ core commit/handoff → Q2 patch/generation。不要把 YAML
# step 的直接 Store/Provider 行为当作 R4 source acceptance 证据。

schema_version: 1
name: archive-text
description: "归档纯文本内容工作流（非交互调用）"

# 工作流步骤（顺序执行）
steps:
  - id: ai_analyze
    type: ai_analyze
    config:
      tasks:
        - summarize
        - extract_tags
      max_words: 300
      num_tags: 5
    on_error: continue      # AI 失败则跳过，保留 TextFallbackProcessor 的默认摘要

  - id: review_entry
    type: review_entry
    config:
      required: false
      max_regenerations: 3
      preview_chars: 500
    on_error: continue

  - id: store_entry
    type: store_entry
    config:
      targets:
        - markdown      # Markdown Front Matter (主存储)
        - sqlite        # SQLite FTS5 索引
        - vector_index  # hnswlib 向量索引
    on_error: fail  # 存储失败则终止工作流
