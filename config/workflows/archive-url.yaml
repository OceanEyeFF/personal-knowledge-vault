# Archive URL Workflow Configuration
# 归档 URL 工作流配置
#
# 用途: 遗留 WorkflowEngine 的网页兼容配置；不是公开 R4 archive 的执行配置
# 触发方式: CLI 命令 `pkv archive <url>`
#
# 此 YAML 仅描述 WorkflowEngine 兼容步骤；该 Engine 路径可保留历史的 Analyze/Store 行为。
# 真实 CLI/MCP `archive_url` 不执行该 step list：它由 KnowledgeApplication 直接进入
# Q0 admission/PreparedDocument → Q1′ core commit/handoff → Q2 patch/generation。不要把 YAML
# step 的直接 Store/Provider 行为当作 R4 source acceptance 证据。
#
# 工作流步骤说明:
# 1. fetch_content: 使用 processors 抓取网页内容
# 2. ai_analyze: 遗留 Engine step；真实 R4 summary/tag 由 Q2 patch 回送 Q1′
# 3. idea_sharpen: 人机交互优化（可选，根据触发规则）
# 4. review_entry: CLI 人工审核；GUI/MCP 通过 skip_review 显式跳过
# 5. store_entry: 遗留 Engine step；真实 R4 产品路径由 Q1′/Q2 协调 storage/generation

schema_version: 1
name: archive-url
description: "智能归档网页内容工作流"

# 工作流步骤（顺序执行）
steps:
  - id: fetch_content
    type: fetch_content
    config:
      processor: auto
      url_key: url
      timeout: 30  # 抓取超时时间（秒）
      retry: 3     # 重试次数
    on_error: fail  # 抓取失败则终止工作流

  - id: ai_analyze
    type: ai_analyze
    config:
      tasks:
        - summarize
        - extract_tags
      max_words: 300
      num_tags: 5
    on_error: continue      # AI 失败则跳过，使用默认值

  - id: idea_sharpen
    type: idea_sharpen
    config:
      questions:
        - "这篇内容与你现有知识中的哪些观点有关？"
        - "你最认同或最质疑的结论是什么？"
      # idea Sharpen 触发规则（满足任一即触发）
      trigger_rules:
        - content_length_gt: 3000          # 内容长度 > 3000 字
        - content_type_in:                 # 内容类型匹配
            - "wechat"
            - "zhihu"
        - contains_keywords:               # 包含关键词
            - "观点对比"
            - "立场分析"
    on_error: continue      # 交互步骤故障时保留 AI 默认分析

  - id: review_entry
    type: review_entry
    config:
      required: true
      max_regenerations: 3
      preview_chars: 500
    on_error: continue

  - id: store_entry
    type: store_entry
    config:
      targets:
        - markdown      # Markdown Front Matter (主存储)
        - sqlite        # SQLite FTS5 索引
        - vector_index  # hnswlib 向量索引
    on_error: fail  # 存储失败则终止工作流
